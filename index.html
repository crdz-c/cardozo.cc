    <!-- Progressive enhancement: the hidden "booting" state exists only when JS runs, and a
         failsafe lifts it, so the content can never stay invisible. The theme is decided here, before the
         first paint: ?theme=light|dark, else the visitor's saved choice, else the system's. -->
    <script>
      (function () {
        var h = document.documentElement;
        h.classList.add("js");
        var t = null;
        try {
          t = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = null;
          try {
            t = localStorage.getItem("cc-theme");
          } catch (e) {}
        }
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        h.setAttribute("data-theme", t);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.removeAttribute("media");
          m.setAttribute("content", t === "light" ? "#ffffff" : "#000000");
        });
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce) {
          h.classList.add("booting");
          setTimeout(function () {
            h.classList.remove("booting");
          }, 6000);
        }
      })();
    </script>
