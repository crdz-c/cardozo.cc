<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucas Cardozo — swarm</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="../favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <style>
      /* An experiment, not a page of the site (docs/PLANKTON.md §14): one set of dots that is told to become an interface, a picture,
         a cube, a sphere, a column, and moves between them like a drone show. Built as the DOM and the canvas: the interface below is
         real HTML, laid out by CSS; swarm.js reads it and draws it as dots, and with the canvas running it is transparent (never
         hidden: hover, focus and screen readers keep working on it). Nothing scrolls. Unlisted: it lives at /swarm. */
      :root {
        --paper: #f0efea;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--paper);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .ui {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 16px;
        text-align: center;
      }
      .ui h1 {
        margin: 0;
        font-size: clamp(40px, 11vmin, 112px);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .ui p {
        margin: 0;
        font-size: clamp(14px, 2.4vmin, 20px);
        opacity: 1;
      }
      .ui nav {
        display: flex;
        gap: 14px;
        margin-top: 10px;
      }
      .ui button {
        font: inherit;
        font-size: clamp(14px, 2.4vmin, 19px);
        color: inherit;
        background: transparent;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 10px 24px;
        cursor: pointer;
      }
      html.gl .ui {
        opacity: 0; /* not hidden: it keeps its place, its hover, its focus, its semantics */
      }
      html.gl.live canvas {
        cursor: none; /* the pointer is a hole in the dots */
      }
      .hud {
        position: fixed;
        z-index: 2;
        bottom: 14px;
        font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        color: rgba(240, 239, 234, 0.55);
        letter-spacing: 0.02em;
        margin: 0;
      }
      .hud.name {
        left: 16px;
      }
      .hud.pix {
        right: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hud b {
        color: var(--paper);
        font-weight: 600;
      }
      .hud input[type="range"] {
        width: 120px;
        accent-color: var(--paper);
        touch-action: pan-x;
      }
      @media (max-width: 640px) {
        .hud.name {
          right: 16px; /* the line may wrap: the slider goes above it, full width */
        }
        .hud.pix {
          left: 16px;
          bottom: 56px;
        }
        .hud input[type="range"] {
          flex: 1;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <main class="ui" id="ui">
      <h1 data-id="1" data-tone="1">cardozo.cc</h1>
      <p data-id="2" data-tone="0.6">dots that behave as if each one were alive</p>
      <nav aria-label="Sections">
        <button type="button" data-id="3" data-tone="0.9">work</button>
        <button type="button" data-id="4" data-tone="0.9">notes</button>
        <button type="button" data-id="5" data-tone="0.9">contact</button>
      </nav>
    </main>
    <p class="hud name" id="hud"><b id="layer-name">ui</b> <span id="layer-no">1/5</span> · click: next layer · ← → · 1–5 · drop an image on the picture</p>
    <label class="hud pix">
      pixel <span>fine</span>
      <input id="pixel" type="range" min="0" max="1" step="0.01" value="0" aria-label="Pixel size: from fine dust (0) to the screen's grid with a few squares (1)" />
      <span>grid</span>
    </label>
    <script type="module" src="swarm.js"></script>
  </body>
</html>
