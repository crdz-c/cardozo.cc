<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucas Cardozo — disk</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="../favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <style>
      /* Nothing on screen but the CD, in the hero's dots (see disk.js). Not linked from the home page: it lives at /disk. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated; /* crisp cells when the canvas is upscaled on high-DPI screens */
        cursor: grab; /* the disc turns under a drag; a tap (no movement) sends the wave */
      }
      canvas.drag {
        cursor: grabbing;
      }
      /* with no WebGL or no script: the CD itself, flat */
      .flat {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(80vmin, 100%);
        height: auto;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" role="img" aria-label="A compact disc made of dots, turning. Drag to turn it."></canvas>
    <noscript><img class="flat" src="media/cd.png" alt="A compact disc" /></noscript>
    <script type="module" src="disk.js"></script>
  </body>
</html>
